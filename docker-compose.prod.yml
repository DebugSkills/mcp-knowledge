# =============================================================================
# docker-compose.prod.yml — продовый стек для ИЗОЛИРОВАННОГО контура (air-gap)
#
# Поднимается из bundle: mcp-kb-airgap-bundle.tar.gz (см. scripts/offline-deploy.sh)
#   tar -xzf mcp-kb-airgap-bundle.tar.gz
#   ./scripts/offline-deploy.sh deploy
#
# Топология:
#   - qdrant        — контейнер в этом compose (порты 6333 REST / 6334 gRPC)
#   - mcp-server    — network_mode: host (Ollama на хосте слушает 127.0.0.1:11434);
#                     видит qdrant через localhost:6333 (REST, QDRANT_PREFER_GRPC=false)
#   - Ollama        — системный сервис хоста + модели из bundle (~/.ollama/models)
#
# Данные (volume на хосте, сохраняются при пересоздании контейнеров):
#   - ./data/qdrant      — Qdrant storage
#   - ./knowledge        — Markdown SSOT (read-write: write_knowledge + git)
#   - ./data/quality     — отчётные артефакты quality
#   - ./data/dlq         — dead-letter queue
# =============================================================================

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: mcp-qdrant-prod
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
      - ./data/qdrant/snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mcp-server:
    image: mcp-knowledge-server:prod
    container_name: mcp-knowledge-server
    # host-сеть: Ollama на хосте слушает ТОЛЬКО 127.0.0.1:11434 (loopback).
    # Альтернатива (если на проде OLLAMA_HOST=0.0.0.0): обычная сеть +
    # OLLAMA_URL=http://host.docker.internal:11434 + QDRANT_URL=http://qdrant:6334
    # и QDRANT_PREFER_GRPC=true (gRPC внутри docker-сети).
    network_mode: host
    volumes:
      - ./knowledge:/app/knowledge           # SSOT (read-write: write_knowledge + git commit)
      - ./data/dlq:/app/data/dlq
      - ./data/quality:/app/data/quality
    env_file:
      - .env
    environment:
      - EMBEDDING_BACKEND=ollama
      - OLLAMA_URL=http://localhost:11434
      - OLLAMA_MODEL=mxbai-embed-large
      # EMBEDDING_MODEL — имя HF-токенизатора для chunker (НЕ Ollama-модель!)
      - EMBEDDING_MODEL=BAAI/bge-m3
      - QDRANT_URL=http://localhost:6333
      - QDRANT_PREFER_GRPC=false
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
