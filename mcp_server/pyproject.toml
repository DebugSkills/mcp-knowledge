[project]
name = "mcp-knowledge-server"
version = "0.1.0"
description = "MCP Knowledge Server — семантическая база знаний для AI-агентов"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34",
    "starlette>=0.45",
    "qdrant-client>=1.13.0,<1.15",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "transformers>=5.14,<6",      # Фаза 8.2: tighten — 5.14.1 = актуальная PyPI stable; фиксирует major 5.x (5.0.0 = breaking changes относительно 4.x)
    "torch>=2.0",                  # Фаза 8.1: явная зависимость. GPU-build (cu121) — через requirements-gpu.txt / `make install-gpu`
    "onnxruntime>=1.18",
    "prometheus-client>=0.20",
    "gitpython>=3.1",
    "python-dotenv>=1.0",         # .env support (pydantic-settings peer)
    "tokenizers>=0.22.0,<=0.23.0",  # Фаза 7.4: pin для совместимости с transformers 5.14.1
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",                # TestClient for FastAPI
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/"]
addopts = "--strict-markers -m 'not e2e_slow'"
markers = [
    "e2e: end-to-end tests (require real Qdrant+Ollama)",
    "e2e_slow: slow E2E — not in default e2e run (только через `make e2e-slow`)",
]

[tool.coverage.run]
source = ["src/mcp_server/content", "src/mcp_server/tools/content.py"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 85       # Фаза 7.3: coverage regression gate (tools/content.py ≥86%)
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __repr__",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
