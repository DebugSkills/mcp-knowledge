[project]
name = "mcp-knowledge-server"
version = "0.1.0"
description = "MCP Knowledge Server — семантическая база знаний для AI-агентов"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34",
    "starlette>=0.45",
    "qdrant-client>=1.13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",         # P1-4: явная зависимость (токенайзер XLM-R, BGE-M3)
    "onnxruntime>=1.18",
    "prometheus-client>=0.20",
    "gitpython>=3.1",
    "python-dotenv>=1.0",         # .env support (pydantic-settings peer)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",                # TestClient for FastAPI
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/"]
