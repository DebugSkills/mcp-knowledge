# e2e kb-console (Ф6, arch-2026-10-10-ai-ws-acceptance): локальный конфиг,
# чтобы addopts юнит-прогона (kb-console/pyproject.toml: -m 'not e2e')
# не действовал здесь, а браузер/маркеры были прописаны по умолчанию.
# Headless — дефолт pytest-playwright (--headed — только для отладки).
[pytest]
addopts = --strict-markers --browser chromium
markers =
    e2e: browser e2e kb-console — живой стек (KB_CONSOLE_URL), запуск `make console-e2e`
    # Ф6-1: НЕ используется e2e-тестами. Нужен только чтобы коллекция не падала
    # на --strict-markers: ai_workspace.tools.vp_ab_pilot (нетестовый модуль)
    # импортирует тестовые двойники ai_workspace.tests.test_engine, где есть
    # @pytest.mark.integration; pytest 9 валидирует маркер в момент декорации
    # при ЛЮБОМ транзитивном импорте во время сбора (цепочка из
    # test_s3_calibration.py → admin_api → vp_ab_pilot → tests.test_engine).
    integration: ai_workspace integration-тесты (транзитивный импорт; см. комментарий выше)
