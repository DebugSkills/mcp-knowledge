[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-console"
version = "0.1.0"
description = "MCP Knowledge Console — NiceGUI-клиент для MCP Knowledge Server (диагностика + импорт + поиск)"
requires-python = ">=3.11"
dependencies = [
    # 037 Ф0 (P1-3): тема использует app.colors() — появилось в NiceGUI 3.6.0
    "nicegui>=3.6",
    "httpx>=0.27",
    "uvicorn>=0.34",
    # Ф2 (ai-workspace) шаг #5b: клиент ws-redis session-store (I11/I12).
    # Air-gap (Ф6): redis-py едет в образ kb-console:prod — bundle-pack несёт образ.
    "redis>=5,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # e2e (Ф6 arch-2026-10-10-ai-ws-acceptance): Playwright-раннер tests/e2e
    # (chromium; браузер ставится отдельно: playwright install chromium)
    "pytest-playwright>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

# BLE001/S110 — намеренные: UI-страницы ловят исключения и показывают
# пользователю человекочитаемое сообщение (дашборд не должен падать).
[tool.ruff.lint.per-file-ignores]
"src/kb_console/pages/*.py" = ["BLE001", "S110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/"]
# e2e (Ф6 arch-2026-10-10-ai-ws-acceptance): browser-e2e исключены из юнит-прогонов
# (console-test / preflight G3) — паттерн mcp_server/tests/e2e; запуск: make console-e2e.
addopts = "--strict-markers -m 'not e2e'"
markers = [
    "e2e: browser e2e kb-console — живой стек (KB_CONSOLE_URL); запуск `make console-e2e`",
    # Ф6-1: e2e-тестами НЕ используется. Коллекция tests/ заходит и в tests/e2e/
    # (модули импортируются до deselect -m 'not e2e'); test_s3 тянет цепочку
    # admin_api → tools.vp_ab_pilot → ai_workspace.tests.test_engine с
    # @pytest.mark.integration — pytest 9 при --strict-markers валидирует маркер
    # в момент транзитивного импорта. Регистрируем, чтобы коллекция не падала.
    "integration: ai_workspace integration-тесты (транзитивный импорт из e2e; см. комментарий выше)",
]
