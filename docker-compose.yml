version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: mcp-qdrant-dev
    # 13.21 (фаза Verify): Qdrant падал с «Too many open files» (RocksDB flush + accept errors,
    # Docker-дефолт soft=1024). RocksDB/сегменты требуют больше → ulimits 65535.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "6333:6333"   # REST (gRPC 6334 наружу не пробрасываем — как в текущем dev)
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      # 2026-08-09: снапшоты должны писаться В bind-mount (./data/qdrant/snapshots),
      # иначе Qdrant кладёт их в /qdrant/snapshots (слой контейнера) — они теряются
      # при --force-recreate и не попадают в rsync-бэкап kvm-mcp-knowledge.
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/storage/snapshots
    # В образе v1.13.4 НЕТ curl/wget → healthcheck через bash /dev/tcp
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ollama — LLM-движок проекта (эмбеддинги mxbai + chat qwen2.5vl) на GPU хоста.
  ollama:
    image: ollama/ollama:0.20.2          # пиннинг = версия, КОТОРОЙ ПОСТРОЕН ИНДЕКС Qdrant (host 2026-08-19; host с тех пор 0.33.3 даёт другие векторы!)
    container_name: mcp-knowledge-ollama
    # НЕ host-net: host-ollama (другие проекты) остаётся на 11434. Внутри контейнера
    # слушаем 0.0.0.0 (иначе дефолтный bind 127.0.0.1 контейнера недоступен docker-proxy),
    # наружу публикуем ТОЛЬКО loopback хоста: 127.0.0.1:11435.
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # VRAM 8GB (RTX 2060 SUPER) — GPU SHARED с host-ollama (runner ~622MiB):
      # mxbai 0.67 + qwen2.5vl 5.97 (VL на ~1.3GB тяжелее текстовой qwen2.5:7b —
      # vision-энкодер) = 6.64GB weights + KV/CUDA-ctx ~0.3-1GB → ОДНОВРЕМЕННО обе
      # НЕ влезают. MAX_LOADED_MODELS=1: embed-запрос выгружает qwen и наоборот
      # (эмбеддинги частые, analyze редкий; re-load qwen ~5-10s с диска — приемлемо).
      # keep_alive 30m держит mxbai горячим между поисками (дефолт 5m).
      # =2 — только если host-runner освободит VRAM (проверить nvidia-smi), риск OOM.
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      # ОТДЕЛЬНЫЙ от host-ollama каталог (/usr/share/ollama/.ollama НЕ трогаем):
      # блобы 2 моделей ~6.64GB (mxbai 0.67 + qwen2.5vl 5.97); контейнер работает от root → root-owned файлы, ок
      # (каталог пишет ТОЛЬКО контейнер, host-ollama его не видит)
      - ./data/ollama/models:/root/.ollama/models
    # В образе НЕТ curl → TCP-probe как у qdrant (внутри контейнера канонический 11434)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11434'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Потолок (НЕ резерв): GPU-режим RSS ~0.5-1GB; CPU-fallback qwen ~5-6GB + mxbai + KV.
    # Хост 110GB (94 avail) → 16g безопасен
    mem_limit: 16g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp-knowledge-server
    # host-сеть: доступ к loopback-ПОРТАМ хоста, куда публикуют свои порты
    # bridge-контейнеры этого compose: ollama → 127.0.0.1:11435, qdrant → 6333
    # (из host-сети DNS-имена bridge-сервисов недоступны → localhost:<port>).
    # host-ollama на 11434 (другие проекты) сервером НЕ используется.
    network_mode: host
    volumes:
      - ../knowledge:/app/knowledge           # SSOT (read-write: write_knowledge + git commit)
      - ../data/dlq:/app/data/dlq
      - ../data/quality:/app/data/quality
      - ../data/logs:/app/data/logs           # 13.19: логи сканирования (проброс на хост)
      - ../data/pdf_cache:/app/data/pdf_cache # PDF checkpoint-кэш: переживает передеплой
      - ../data/tokens:/app/data/tokens       # токен-стор (TokenStore): переживает пересоздание контейнера
      - ../models_cache:/app/models_cache
    env_file:
      - .env
    environment:
      - EMBEDDING_BACKEND=ollama
      # ollama-контейнер этого compose (bridge-публикация 127.0.0.1:11435)
      - OLLAMA_URL=http://localhost:11435
      # mxbai-embed-large: русская семантика OK (релевантное 0.70 vs нерелевантное 0.50-0.59),
      # 1024-dim. Лимит ctx 512 токенов (~650 символов русского) → чанки ≤480c (CHUNK_MAX_TOKENS=120).
      # bge-m3 (Ollama registry, F16) — NaN-баг на реальных текстах (500 "unsupported value: NaN"),
      # nomic-embed-text — англоцентричный (коллапс русского: релевантное ≈ нерелевантное).
      - OLLAMA_MODEL=mxbai-embed-large
      # Chat для analyze_content (ollama-контейнер): qwen2.5:7b ТЕКСТОВАЯ —
      # qwen2.5vl (vision) НЕ влезает в 8GB GPU на ollama 0.20.2 (нужен буфер 7.35GB,
      # cudaMalloc OOM → CPU); analyzer шлёт /api/chat текст-онли (VL избыточна).
      - OLLAMA_CHAT_MODEL=qwen2.5:7b
      # EMBEDDING_MODEL — имя HF-токенизатора для chunker (не Ollama-модель!)
      - EMBEDDING_MODEL=BAAI/bge-m3
      # Контейнерный qdrant v1.13.4 (dev==prod), опубликован на хост 6333
      - QDRANT_URL=http://localhost:6333
      - QDRANT_PREFER_GRPC=false
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      # E1 (P1-1 fix): /health/live — всегда 200 пока процесс жив → NO restart storm
      # Было: /health → при embed degraded 503 → Docker перезапускает → бесконечный цикл
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Ограничение ресурсов (инцидент 2026-08-06: сервер умирал из-за нагрузки):
    # Python-сервер лёгкий — 1 ГБ с запасом; embeddings/chat выполняет ollama-контейнер.
    mem_limit: 2g
    cpus: 2
    # Ротация docker-логов: 3 файла × 10 МБ (не дать разрастись бесконечно)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # GPU у mcp-server не нужен — инференс выполняет ollama-контейнер (deploy.resources).

  # kb-console — NiceGUI-клиент (диагностика + импорт + поиск).
  # Отдельный образ: работает и на клиентских хостах (MCP_SERVER_URL из env).
  # host-сеть: обращается к mcp-server на localhost:8000 (как и сервер — к Ollama).
  kb-console:
    build:
      context: ./kb-console
      dockerfile: Dockerfile
    image: kb-console:prod
    container_name: kb-console
    network_mode: host
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://localhost:8000
      - MCP_API_KEY=${MCP_API_KEY:-}
      - CONSOLE_PORT=8085
    # NiceGUI-клиент лёгкий — 512 МБ достаточно.
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # curl в python:3.11-slim отсутствует → проверка через urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
