version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: mcp-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ../data/qdrant:/qdrant/storage     # bind mount — локальный диск (#27)
      - ../data/qdrant/snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp-knowledge-server
    ports:
      - "8000:8000"
    volumes:
      - ../knowledge:/app/knowledge           # SSOT (read-write: write_knowledge + git commit)
      - ../data/dlq:/app/data/dlq
      - ../data/quality:/app/data/quality
      - ../models_cache:/app/models_cache
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # GPU (опционально):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
