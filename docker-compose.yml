version: "3.8"

services:
  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp-knowledge-server
    # host-сеть: Ollama на хосте слушает ТОЛЬКО 127.0.0.1:11434 (loopback),
    # host.docker.internal недоступен без OLLAMA_HOST=0.0.0.0 (требует sudo на хосте).
    # host-сеть даёт прямой доступ к loopback хоста: localhost:11434 + localhost:6333.
    # Альтернатива для удалённых окружений: OLLAMA_HOST=0.0.0.0 + host.docker.internal.
    network_mode: host
    volumes:
      - ../knowledge:/app/knowledge           # SSOT (read-write: write_knowledge + git commit)
      - ../data/dlq:/app/data/dlq
      - ../data/quality:/app/data/quality
      - ../models_cache:/app/models_cache
    env_file:
      - .env
    environment:
      - EMBEDDING_BACKEND=ollama
      - OLLAMA_URL=http://localhost:11434
      - OLLAMA_MODEL=mxbai-embed-large
      # EMBEDDING_MODEL — имя HF-токенизатора для chunker (не Ollama-модель!)
      - EMBEDDING_MODEL=BAAI/bge-m3
      # Хостовый qdrant (gRPC 6334 наружу не проброшен → REST 6333)
      - QDRANT_URL=http://localhost:6333
      - QDRANT_PREFER_GRPC=false
    healthcheck:
      # E1 (P1-1 fix): /health/live — всегда 200 пока процесс жив → NO restart storm
      # Было: /health → при embed degraded 503 → Docker перезапускает → бесконечный цикл
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # GPU (опционально):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # kb-console — NiceGUI-клиент (диагностика + импорт + поиск).
  # Отдельный образ: работает и на клиентских хостах (MCP_SERVER_URL из env).
  # host-сеть: обращается к mcp-server на localhost:8000 (как и сервер — к Ollama).
  kb-console:
    image: kb-console:prod
    container_name: kb-console
    network_mode: host
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://localhost:8000
      - MCP_API_KEY=${MCP_API_KEY:-}
      - CONSOLE_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
