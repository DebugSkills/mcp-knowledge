---
# Общие переменные деплоя mcp-knowledge (несекретные)
deploy_root: /opt/mcp-knowledge        # родительский каталог (basename 'mcp-knowledge' сохраняется!)
repo_name: mcp-knowledge               # compose project name = basename
compose_file: docker-compose.yml       # переносим работающий dev-стек
# DATA_ROOT (code-2026-09-22-002): корень данных ВНЕ git-клона (qdrant/ollama/console);
# рендерится в .env (→ compose ${DATA_ROOT}) + cron-env backup.sh + dirs секция deploy.yml
data_root: "{{ deploy_root }}/data"
old_root: /kvm/mcp-knowledge           # текущий хост (источник)
staging: /opt/mcp-kb-transfer          # промежуточный каталог переноса на новом хосте
min_free_gb: 30

# Ollama-контейнер (новая топология, миграция code-2026-09-08-001)
ollama_url: http://localhost:11435
ollama_model: mxbai-embed-large
ollama_chat_model: qwen2.5:7b
embedding_backend: ollama
tokenizer: BAAI/bge-m3

# Qdrant (контейнерный, host-net mcp-server → localhost)
qdrant_url: http://localhost:6333

# kb-console auth (002): auto → auth ON при непустом vault_console_password;
# для прода рекомендуется "required" (fail-fast, если пароль не задан).
console_auth_mode: "auto"

# kb-console roles (003): bootstrap-username админа (пароль — vault_console_password)
console_admin_user: "admin"

# Docker-прокси (пусто = прямая сеть)
docker_proxy: ""
docker_no_proxy: "localhost,127.0.0.1,::1"

# Список образов для docker save/load (пиннинг!)
transfer_images:
  - mcp-knowledge-mcp-server:latest
  - kb-console:prod
  - qdrant/qdrant:v1.13.4
  - ollama/ollama:0.20.2

# — Параметры подготовки хоста (бывшая роль mcp_kb_host_prepare, инлайн в playbooks/host-prepare.yml) —
# Приоритет: extra vars > host_vars/*.yml > group_vars — host_vars переопределяет эти дефолты.
mcp_kb_host_prepare__install_docker: true

mcp_kb_host_prepare__docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Драйвер NVIDIA ставится ВРУЧНУЮ (уникальная per-host операция; true — только для сознательной автоматизации).
mcp_kb_host_prepare__install_nvidia_driver: false
mcp_kb_host_prepare__nvidia_driver_package: nvidia-driver
mcp_kb_host_prepare__nvidia_reboot: true      # reboot после установки драйвера
# ⚠ Локальный запуск (ansible_connection: local) НЕ переживает reboot:
#   при сознательной установке драйвера локально передавайте
#   -e mcp_kb_host_prepare__nvidia_reboot=false (см. приватный RUNBOOK, Сценарий B).

# deb822-файл источников APT (Debian 12): один путь для stat и replace в блоке nvidia_driver
mcp_kb_host_prepare__debian_sources_path: /etc/apt/sources.list.d/debian.sources

mcp_kb_host_prepare__install_nvidia_toolkit: true

mcp_kb_host_prepare__nvidia_gpg_url: https://nvidia.github.io/libnvidia-container/gpgkey
mcp_kb_host_prepare__nvidia_repo_url: https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list

mcp_kb_host_prepare__docker_gpg_url: https://download.docker.com/linux/debian/gpg
mcp_kb_host_prepare__docker_repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable

# Прокси наследуется из group_vars/all.yml (docker_proxy/docker_no_proxy)
mcp_kb_host_prepare__proxy: "{{ docker_proxy | default('') }}"
mcp_kb_host_prepare__no_proxy: "{{ docker_no_proxy | default('localhost,127.0.0.1,::1') }}"

# — Параметры клонирования репозиториев (бывшая роль mcp_kb_repos, инлайн в playbooks/deploy.yml) —
# Все переменные имеют префикс mcp_kb_repos__
#
# Гибридная схема доступа (fresh-install из git-клона, хост с интернетом):
# - mcp-knowledge (код) — ПУБЛИЧНОЕ репо: анонимный HTTPS-clone, ключи не нужны.
# - knowledge (SSOT знаний) — ПРИВАТНОЕ репо: SSH (git@github.com), на целевом хосте
#   требуется read-only deploy-key (github.com/AndreyChuyan/knowledge → Settings →
#   Deploy keys; БЕЗ «Allow write access»). Ключ кладётся в ~/.ssh/ пользователя,
#   под которым выполняется clone (ansible_user/become, по умолчанию root), и
#   прописывается в ~/.ssh/config (Host github.com). См. ansible/README.md → Runbook
#   «Fresh-install из git-клона» → Предпосылки.
# Важно: git@github.com:DebugSkills/knowledge.git НЕ существует («Repository not found»),
# фактический origin репо знаний — AndreyChuyan/knowledge.
mcp_kb_repos__mcp_knowledge_repo_url: "https://github.com/DebugSkills/mcp-knowledge.git"
mcp_kb_repos__knowledge_repo_url: "git@github.com:AndreyChuyan/knowledge.git"
mcp_kb_repos__version: "main"
# false = clone-once + pin (повторные прогоны деплоя не тянут upstream-обновления)
mcp_kb_repos__update: false

# — Параметры переноса old→new (бывшая роль mcp_kb_transfer, инлайн в playbooks/transfer-*.yml) —
# Этапы pack|bulk|stop|cutover разнесены по отдельным плейбукам (transfer-pack.yml /
# transfer-bulk.yml / transfer-cutover.yml), поэтому mcp_kb_transfer__stage из defaults
# роли НЕ переносится — каждый плейбук = свой этап.
mcp_kb_transfer__old_root: "/kvm/mcp-knowledge"
mcp_kb_transfer__new_root: "/opt/mcp-knowledge"
mcp_kb_transfer__staging: "/opt/mcp-kb-transfer"
mcp_kb_transfer__repo_name: "mcp-knowledge"
mcp_kb_transfer__compose_file: "docker-compose.yml"
mcp_kb_transfer__images:
  - mcp-knowledge-mcp-server:latest
  - kb-console:prod
  - qdrant/qdrant:v1.13.4
  - ollama/ollama:0.20.2
# Зарезервированный флаг: удалить VL-модель из ollama (не влезает в 8GB VRAM).
# Пока не используется задачами — пометка для будущей реализации.
mcp_kb_transfer__drop_vl_model: false
mcp_kb_transfer__min_free_gb: 30
mcp_kb_transfer__excludes:
  - .venv
  - artifacts
  - mcp-kb-airgap-bundle.tar.gz
  - .trash
  - __pycache__
  - .pytest_cache
  - .playwright-mcp
  - node_modules
  - "*.pyc"
