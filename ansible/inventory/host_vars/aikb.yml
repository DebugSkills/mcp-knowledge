---
# host_vars/aikb — целевой хост БЗ: fresh-install с запуском ЛОКАЛЬНО на самом aikb.
# Порядок: склонировать репозиторий mcp-knowledge на aikb (НЕ в /opt/mcp-knowledge/mcp-knowledge!)
#          → cd <клон>/ansible → make deps → make vault-create → make run PLAYBOOK=...
# ⚠️ Значения продублированы из group_vars/all.yml для самодостаточности;
#    при изменении общего дефолта обновите и здесь (host_vars имеет приоритет над group_vars).

# ─── Подключение: Сценарий A/B, локальный bootstrap ───
ansible_connection: local
ansible_python_interpreter: /usr/bin/python3
# Требуется root/sudo (playbooks идут с become: true) — passwordless sudo либо --ask-become-pass.
# ⚠️ Локальный запуск НЕ переживает reboot: reboot внутри play убьёт сам ansible-процесс.
#    Поэтому ниже mcp_kb_host_prepare__nvidia_reboot: false — перезагрузка ВРУЧНУЮ.
#
# Альтернатива — запуск с другого control-node по SSH (раскомментируйте и заполните):
# ansible_connection: ssh
# ansible_host: <ip-aikb>
# ansible_user: root
# ansible_ssh_private_key_file: ~/.ssh/aikb_ed25519

# ─── mcp_kb_host_prepare (Сценарий B) ───
mcp_kb_host_prepare__install_docker: true
# драйвер NVIDIA на aikb уже установлен ВРУЧНУЮ (nvidia-smi работает)
mcp_kb_host_prepare__install_nvidia_driver: false
mcp_kb_host_prepare__install_nvidia_toolkit: true
mcp_kb_host_prepare__nvidia_driver_package: nvidia-driver
# применяется только при mcp_kb_host_prepare__install_nvidia_driver: true;
# локальный запуск: reboot вручную (см. приватный runbook)
mcp_kb_host_prepare__nvidia_reboot: false

# ─── deploy (Сценарий A) ───
deploy_root: /opt/mcp-knowledge
repo_name: mcp-knowledge
compose_file: docker-compose.yml
min_free_gb: 30

# ─── ollama / embedding ───
ollama_url: http://localhost:11435
ollama_model: mxbai-embed-large
ollama_chat_model: qwen2.5:7b
embedding_backend: ollama
tokenizer: BAAI/bge-m3

# ─── Qdrant ───
qdrant_url: http://localhost:6333

# ─── Docker proxy (пусто = прямая сеть) ───
docker_proxy: ""
docker_no_proxy: "localhost,127.0.0.1,::1"

# ─── Сценарий C (перенос old→new) — только если используете transfer ───
# mcp_kb_transfer__new_root: /opt/mcp-knowledge
# mcp_kb_transfer__old_root: /kvm/mcp-knowledge
# mcp_kb_transfer__staging: /opt/mcp-kb-transfer
# mcp_kb_transfer__repo_name: mcp-knowledge
# mcp_kb_transfer__compose_file: docker-compose.yml
# mcp_kb_transfer__min_free_gb: 30

# ─── Секреты (НЕ здесь!) ───
# vault_mcp_read_keys / vault_mcp_write_keys / vault_mcp_import_keys /
# vault_mcp_console_key / vault_cron_write_key → inventory/group_vars/all/vault.yml (ansible-vault).
