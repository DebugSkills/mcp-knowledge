---
# host_vars/aikb — целевой хост БЗ: fresh-install с запуском ЛОКАЛЬНО на самом aikb.
# Порядок: склонировать репозиторий mcp-knowledge на aikb (НЕ в /opt/mcp-knowledge/mcp-knowledge!)
#          → cd <клон>/ansible → make deps → make vault-create → make run PLAYBOOK=...
# ⚠️ Значения продублированы из group_vars/all/main.yml для самодостаточности;
#    при изменении общего дефолта обновите и здесь (host_vars имеет приоритет над group_vars).

# ─── Подключение: Сценарий A/B, локальный bootstrap ───
ansible_connection: local
ansible_python_interpreter: /usr/bin/python3
# Требуется root/sudo (playbooks идут с become: true) — passwordless sudo либо --ask-become-pass.
# ⚠️ Локальный запуск НЕ переживает reboot: reboot внутри play убьёт сам ansible-процесс.
#    Поэтому ниже mcp_kb_host_prepare__nvidia_reboot: false — перезагрузка ВРУЧНУЮ.
#
# Альтернатива — запуск с другого control-node по SSH (раскомментируйте и заполните):
# ansible_connection: ssh
# ansible_host: <ip-aikb>
# ansible_user: root
# ansible_ssh_private_key_file: ~/.ssh/aikb_ed25519

# ─── mcp_kb_host_prepare (Сценарий B) ───
mcp_kb_host_prepare__install_docker: true
# драйвер NVIDIA на aikb уже установлен ВРУЧНУЮ (nvidia-smi работает)
mcp_kb_host_prepare__install_nvidia_driver: false
mcp_kb_host_prepare__install_nvidia_toolkit: true
mcp_kb_host_prepare__nvidia_driver_package: nvidia-driver
# применяется только при mcp_kb_host_prepare__install_nvidia_driver: true;
# локальный запуск: reboot вручную (см. приватный runbook)
mcp_kb_host_prepare__nvidia_reboot: false

# ─── deploy (Сценарий A) ───
deploy_root: /opt/mcp-knowledge
repo_name: mcp-knowledge
compose_file: docker-compose.yml
min_free_gb: 30
# data_root — дубль group_vars/all/main.yml (файл самодостаточен, см. шапку)
data_root: /opt/mcp-knowledge/data
# ─── air-gap (aikb): сборка образов невозможна без pypi/DNS ───
# Образы приходят из офлайн-бандла (docker load) → сборку пропускаем.
mcp_kb_docker__build: false
# bootstrap-reindex выполнен 2026-10-02 (Э6-Э8); для свежего узла включать вручную
# (true), после первого успешного reindex — выключать (false). Оставленный true на
# живом узле несёт риск незапрошенного полного reindex при повторном deploy.yml
# (аудит контурной изоляции 2026-10-02, Н1/Н2).
mcp_kb_docker__bootstrap_reindex: false

# ─── LAN / TLS-фасад kb-console (трасса 030/033-F2; aikb — своя локальная сеть) ───
# Проверено 2026-09-29: enp13s0 UP 192.168.10.253/24, шлюз 192.168.10.1, DNS 192.168.10.254.
# console_lan_ip → адрес листенера Caddy (https://<ip>:8443) и CONSOLE_LAN_IP в .env;
# lan_cidr → и ufw-правила (host-prepare), и CONSOLE_LAN_CIDR (allow-list фасада) одним значением.
console_lan_ip: "192.168.10.253"
mcp_kb_host_prepare__lan_cidr: ["192.168.10.0/24"]
mcp_kb_host_prepare__lan_ports: ["8443", "8444", "8445"]   # 8443=kb-console TLS, 8444=MCP-фасад (F10), 8445=workspace-верстак TLS (ws-airgap Ф2)
# console_lan_ip обязан быть исключён из прокси (если прокси есть): берётся автоматически
# в mcp_kb_host_prepare__no_proxy через docker_no_proxy | default(... ~ console_lan_ip).

# ─── Docker: зеркало apt (проверено с aikb 2026-09-29) ───
# `download.docker.com` из сети aikb НЕДОСТУПЕН (curl timeout, 000) — дефолт group_vars не годится.
# mirrors.aliyun.com → 200: gpg-ключ (3817 B) + все пакеты списка (docker-ce, docker-ce-cli,
# containerd.io, docker-buildx-plugin, docker-compose-plugin 2.16 → compose v2, нужен для
# `docker compose up -d --build --wait`). Альтернативы проверены и НЕ работают: yandex-mirror (404),
# tencent/tuna/mirror.docker.ru (000). Debian-пакеты (docker.io 20.10 + docker-compose 1.29) не годятся — нет v2.
mcp_kb_host_prepare__docker_gpg_url: "https://mirrors.aliyun.com/docker-ce/linux/debian/gpg"
mcp_kb_host_prepare__docker_repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://mirrors.aliyun.com/docker-ce/linux/debian bookworm stable"

# ─── Прод-защита консоли (RUNBOOK §M2) ───
# fail-fast: без vault_console_password контейнер консоли не поднимется «молча без пароля».
console_auth_mode: required

# ─── ollama / embedding ───
ollama_url: http://localhost:11435
ollama_model: mxbai-embed-large
ollama_chat_model: qwen2.5:7b
embedding_backend: ollama
tokenizer: BAAI/bge-m3

# ─── Qdrant ───
qdrant_url: http://localhost:6333

# ─── Docker proxy (пусто = прямая сеть) ───
docker_proxy: ""
docker_no_proxy: "localhost,127.0.0.1,::1"

# ─── Сценарий C (перенос old→new) — только если используете transfer ───
# mcp_kb_transfer__new_root: /opt/mcp-knowledge
# mcp_kb_transfer__old_root: /kvm/mcp-knowledge
# mcp_kb_transfer__staging: /opt/mcp-kb-transfer
# mcp_kb_transfer__repo_name: mcp-knowledge
# mcp_kb_transfer__compose_file: docker-compose.yml
# mcp_kb_transfer__min_free_gb: 30

# ─── Секреты (НЕ здесь!) ───
# vault_mcp_read_keys / vault_mcp_write_keys / vault_mcp_import_keys /
# vault_mcp_console_key / vault_cron_write_key → inventory/group_vars/all/vault.yml (ansible-vault).

# WS-слой верстака (arch-2026-10-10-ws-airgap-layers): поднимать вместе с обновлением.
ws_layer_enabled: true

# R8a (Ф5 arch-2026-10-10-ws-airgap-layers): контурный override адреса ollama WS-слоя.
# host_vars > group_vars(file-каскад stack.settings.yaml): узел всегда получает host-ollama,
# даже когда stack.settings.yaml приехал в air-gap пакете с dev-значением.
ws_local_ollama_base: "host.docker.internal:11434"
