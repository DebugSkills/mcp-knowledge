---
# Role: mcp_kb_docker
# Назначение: docker compose up + health-check (mcp-server, qdrant, ollama)

- name: Копировать .env из шаблона
  ansible.builtin.template:
    src: "{{ playbook_dir | dirname }}/templates/.env.j2"
    dest: "{{ deploy_root }}/{{ repo_name }}/.env"
    mode: '0600'

# Явный build перед up: сценарий обновления (git pull → build → up) обязан пересобирать
# образы mcp-server/kb-console из клона (up строит образ только при его отсутствии).
# changed_when: false — build идемпотентен на уровне compose (кеш слоёв: без изменений
# в контексте пересборки нет), а always-changed ломал бы идемпотентность dry-run'ов;
# фактический перезапуск изменённых сервисов отслеживает задача up ниже.
- name: Собрать образы из клона (mcp-server, kb-console)
  ansible.builtin.command:
    cmd: docker compose -f {{ compose_file }} build
    chdir: "{{ deploy_root }}/{{ repo_name }}"
  register: build_result
  changed_when: false

- name: Запустить docker compose
  ansible.builtin.command:
    cmd: docker compose -f {{ compose_file }} up -d --wait
    chdir: "{{ deploy_root }}/{{ repo_name }}"
  register: compose_result
  changed_when: compose_result.stdout is search('Started|Running|Creating|Created|Built')

- name: Проверить health mcp-server
  ansible.builtin.uri:
    url: http://localhost:8000/health
    return_content: true
  register: health_result
  until: health_result.status == 200
  retries: 10
  delay: 5

- name: Проверить health Qdrant
  ansible.builtin.uri:
    url: http://localhost:6333/healthz
    return_content: true
  register: qdrant_health
  until: qdrant_health.status == 200
  retries: 10
  delay: 5

- name: Проверить health Ollama
  ansible.builtin.uri:
    url: http://localhost:11435/api/tags
    return_content: true
  register: ollama_health
  until: ollama_health.status == 200
  retries: 10
  delay: 5
