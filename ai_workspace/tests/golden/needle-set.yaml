      заголовков. Валидация схемы встроена в продюсер: запись с неизвестным полем
      не покидает контур-источник. Экспорт журнала для аудита делается снимком на
      момент времени, без живых курсоров.

      Каждая версия спецификации фиксирует примеры валидных и невалидных записей в
      приложении. Мониторинг парсера отслеживает долю отказов: рост выше одного
      процента — повод для разбора формата. Резервная копия журнала хранится два
      цикла ротации и проверяется восстановлением выборки.

      Журнал обмена фиксирует посылки между контурами: заголовок, маршрут и
      контрольная сумма записи. Формат записи стабилен три года; изменения схемы
      проходят через отдельный процесс версионирования. Парсер проверяет заголовок
      до разбора полей: несовпадение отправляет запись в карантин, а не в
      обработку.

      Поле маршрута кодирует цепочку контуров; глубина цепочки ограничена пятью
      переходами. Превышение глубины маршрута — отказ и алерт дежурному, а не
      молчаливая потеря посылки. Контрольная сумма считается по полезной нагрузке,
      заголовок в расчёт не входит.

      Несовпадение суммы приводит к повторной посылке; после двух неудач запись
      помечается битой. Карантин просматривается дважды в сутки: каждая запись
      получает вердикт и причину. Потоковая выгрузка журнала организована блоками
      по тысяче записей с маркером конца блока.

      Кодирование полей — строгий UTF-8, недопустимые байты отбрасываются с
      фиксацией в счётчиках. Дедупликация посылок работает по идентификатору
      дубликата на стороне приёмника. Статистика обмена собирается по часам:
      объём, доля карантинных записей и средняя глубина маршрута.

      ## Маршрутизация и целостность
      Поле маршрута кодирует цепочку контуров; максимальная глубина — пять
      переходов, сверх — отказ и алерт дежурному. Сумма считается по полезной
      нагрузке; после двух несовпадений запись помечается битой. Карантин
      просматривается дважды в сутки с обязательным вердиктом.

      ## Задание
      Напиши раздел статьи «Журнал обмена: анатомия записи». В подразделе «Маркер
      формата» приведи значение магического маркера дословно, как оно указано в
      спецификации, и поясни, зачем маркер нужен. Опиши поля записи и лимит
      маршрутизации.
