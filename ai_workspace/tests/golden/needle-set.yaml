      ## Наблюдаемость и контроль затрат
      Логи агрегируются централизованно; срок хранения девяносто дней, дальше —
      архив и очистка. Дашборды нагрузки перестроены на новые метрики очередей и
      показывают утилизацию по сегментам полки. Ежемесячный отчёт по затратам
      рассылается владельцам сервисов автоматически.

      ## Задание
      Напиши раздел статьи «Экономика стека: годовой итог». В подразделе «Бюджет
      следующего цикла» приведи код бюджетной заявки дословно, как он
      зарегистрирован в материале, и укажи, что заявка вмещает. Назови также
      главные статьи расходов года и долю хранения в бюджете.
    expect_needle: "TG-7741-DELTA"
  - id: n02-metric-decimal
    zone: public
    prompt: |
      # Входной материал: деградация качества при длинном контексте

      ## Введение
      Команда проверяла, как длина и способ подготовки входа влияют на удержание
      фактов моделью. Серия A/B-прогонов по двенадцать ячеек, медианы считались по
      пяти прогонам на ячейку; сетка параметров зафиксирована до старта. Контроль
      хода выполнения — обязательная часть протокола серии.

      Ниже — методика, результаты и интерпретация. Ключевой коэффициент серии
      вынесен в текст отчёта и используется как опорная точка всех сводок.
      Материал предназначен для статьи о потерях при сжатии контекста, поэтому
      цифры приводятся без округления.

      ## Протокол замеров и результаты
      Серия замеров строилась по схеме A/B: контрольная рука с полным контекстом и
      экспериментальная со сжатым входом. Каждая ячейка сетки прогонялась пять
      раз, медиана считалась по устойчивым прогонам без ошибок инфраструктуры.
      Дисперсия внутри ячейки фиксировалась отдельно: разброс выше порога означал
      необходимость дополнительных прогонов.

      Контрольные задания без скрытого факта отсеивали угадывание: ссылка на
      отсутствующий факт браковала прогон. Позиционные пробы чередовали
      расположение факта, чтобы исключить привыкание модели к одной части входа.
      Все артефакты измерений — сырые выводы, промпты и зерна генерации —
      складывались в неизменяемое хранилище трасс.

      Воспроизводимость проверялась повторным прогоном через неделю на той же
      версии модели и тех же зернах. Выбросы не удалялись молча: каждый выброс
      получал категорию причины и учитывался в отчёте отдельной строкой.
      Доверительные интервалы строились бутстрэпом по прогонам, без предположений
      о нормальности распределения.

      Эффект края проверялся явным сравнением: факты из первой и последней третей
      входа против середины. Регрессия к среднему контролировалась увеличением
      числа прогонов в спорных ячейках до девяти. Метрика удержания — доля
      ответов, опирающихся на факт; сравнение строк строгое, без нормализации
      регистра.

      Протокол фиксации решений запрещал менять параметры сетки после старта
      серии, чтобы не подгонять результат. Статистическая значимость разницы рук
      оценивалась парным критерием по согласованным парам заданий. Логи измерителя
      прошли отдельный аудит: тайминги, длины входов и счётчики токенов сверялись
      с журналом шлюза.

      Ни один замер не выбрасывался постфактум: смена конфигурации означала новую
      серию с новым идентификатором. Сводная таблица серии содержит по строке на
      ячейку: медиана, разброс, доля ошибок и число прогонов. Выводы
      формулировались консервативно: эффект считался устойчивым только при
      подтверждении повторной серией.

