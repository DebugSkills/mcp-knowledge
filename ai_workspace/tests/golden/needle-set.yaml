# ============================================================================
# Needle-set v3 (M4, В2-B подготовка повтора 2f, arch-2026-10-08-f7-calibration)
# — retention-задания для инверсии CC1.
#
# v3 по итогам CC1 2026-10-09 (секции > бюджета сжатия 4000 ⇒ compressed
# реально режет; needle в средней трети). Корень негатива-2 CC1
# (plans/_provenance/arch-2026-10-08-f7-calibration/cc1-result.md): в v2
# секции материала ~600-1200 симв. < max_chars_per_section=4000 класса fast
# (registry/model_classes.yaml) ⇒ shaping compressed — no-op (секция в
# бюджете идёт в промпт байт-в-байт, engine.shape_section), обе руки CC1
# получали идентичный вход (needle_rate 0.833/0.833 — инверсия невозможна).
#
# v3-контракт каждого задания: длинная секция материала 5000-6500 симв.
# (> 4000) и весь промпт >= 7000 симв.; needle спрятан в СРЕДНЕЙ трети
# длинной секции (доля позиции в секции ∈ [0.3, 0.7]) и попадает в зону
# среза промпта «голова+хвост» (head 3200 / tail 800 при бюджете 4000,
# head_share 0.8) — промпт едет в движок ОДНОЙ секцией brief
# (vp_ab_pilot.run_one), поэтому compressed-рука фактически теряет факт,
# full-context — сохраняет. Проверки — tests/test_calibration_needle.py
# (в т.ч. механическая на самом engine.shape_section). Блок «## Задание»
# несёт ЯВНУЮ инструкцию дословного переноса и НЕ содержит литерал needle
# (иначе recency-копирование из задания сравняет руки). Детект — grep
# expect_needle в выводе измерителя (calibration/probe.py, document/draft,
# без LLM-оценщика), метрика — needle_rate (порог policy.NEEDLE_RATE_FLOOR).
#
# ⚠️ ЧЕРНОВИК — КОНТЕНТ НА РЕЦЕНЗИЮ ОПЕРАТОРА (owner: operator): промпты/
# needle-факты — draft; оператор ревьюит до первого живого прогона.
# Активация в манифесте прогона — тоже оператор: probe-run --needle <этот
# файл>. Повтор negative-control 2f — tests/golden/needle-negative-control-CC1.md.
# ============================================================================
version: 3
owner: operator
status: draft          # до рецензии оператора живой прогон не запускается
min_runs: 3            # спека probe-suite §143: доли/медианы осмысленны при N>=3
tasks:
  - id: n01-budget-code
    zone: public
    prompt: |
      # Входной материал: годовой обзор инфраструктуры

      ## Введение
      Обзор суммирует расходы контура за завершившийся год: вычисления, хранение,
      сеть и сопровождение. Все цифры выверены по биллингу поставщиков и
      внутренним счётчикам; расхождения сверялись с финансовой службой до закрытия
      периода. Структура обзора повторяет структуру бюджета, чтобы читатель мог
      сопоставить статьи расходов с решениями комитета.

      Материал служит основой статьи об экономике собственного стека: из него
      берутся код бюджетной заявки следующего цикла, разбивка статей расходов и
      итоги по хранению. Отдельные громкие статьи разобраны в собственных секциях
      ниже. Читателю, которому нужны только итоги, достаточно раздела задания.

      ## Бюджет следующего цикла
      Основная статья расходов контура — вычисления: GPU-полка занимает до
      шестидесяти процентов годового бюджета электроэнергии. Закупка узлов
      проходит двухступенчатый тендер: технический отбор, затем ценовой, с
      фиксацией конфигурации на весь цикл. Амортизация серверного парка
      размазывается по кварталам, чтобы пики отчётности не искажали картину
      затрат.

      Хранение растёт медленнее вычислений: после дедупликации блоб-стор занимает
      восемнадцать процентов бюджета. Сетевой трафик между контурами
      тарифицируется отдельно, его доля стабильно держится около семи процентов.
      Охлаждение учитывается отдельной строкой: летом коэффициент растёт, зимой
      частично компенсируется рекуперацией.

      Гарантийные обязательства вендоров покрывают замену дисков и памяти, но не
      покрывают простой вычислительных узлов. Резерв на непредвиденные закупки
      утверждён в размере десяти процентов от операционной части бюджета. Плановый
      комитет по бюджету собирается раз в квартал; внеочередные заявки требуют
      обоснования в двухнедельный срок.

      Сравнение с прошлым циклом показывает экономию на лицензиях после перехода
      на открытые сборки инструментария. Расходы на мониторинг считаются
      неизбежными: сокращение наблюдаемости всегда обходится дороже самих
      дашбордов. Каждая заявка на закупку сопровождается расчётом совокупной
      стоимости владения на три года вперёд.

      Энергопотребление замеряется на вводе в машинный зал и сверяется с биллингом
      поставщика каждый месяц. Утилизация дорогих узлов — ключевой индикатор
      экономики: простой вычислителя дороже, чем простой дисковой полки. Бюджет
      следующего года защищается в двух сценариях: базовом и консервативном, с
      раздельными риск-профилями.

      Отчёт по затратам публикуется внутри команды ежемесячно, чтобы владельцы
      сервисов видели свою долю расходов. Пересмотр тарифов на электричество
      закладывается в модель заранее, с горизонтом в два квартала. Возврат
      неиспользованных средств в конце цикла не переносится автоматически:
      требуется решение комитета.

