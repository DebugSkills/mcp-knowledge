# ============================================================================
# Needle-set M4 (В2-B шаг 2a, arch-2026-10-08-f7-calibration) — retention-
# задания: ДОЛГИЙ многосекционный вход, в толще которого спрятан уникальный
# needle-факт; детект — grep expect_needle в выводе измерителя
# (calibration/probe.py, без LLM-оценщика), метрика — needle_rate (доля
# найденных, M4) с порогом policy.NEEDLE_RATE_FLOOR в рамке D6 (2e).
#
# ⚠️ ЧЕРНОВИК — КОНТЕНТ НА РЕЦЕНЦИЮ ОПЕРАТОРА (owner: operator):
# промпты/needle-факты — draft; оператор ревьюит до первого живого прогона.
# Активация в манифесте прогона — тоже оператор: probe-run --needle <этот файл>.
# Negative-control CC1 (2f, критерий приёмки В2) —
# tests/golden/needle-negative-control-CC1.md.
# ============================================================================
version: 1
owner: operator
status: draft          # до рецензии оператора живой прогон не запускается
tasks:
  - id: n01-retention-budget-code
    zone: public
    prompt: |
      # Входной материал: годовой обзор инфраструктуры

      ## Введение
      Обзор суммирует расходы контура за год: вычисления, хранение, сеть.
      Цифры ниже — основа для статьи об экономике self-hosted стека.

      ## Вычисления
      Основная статья расходов — GPU-узлы: два сегмента, qwen-полка и
      heavy-полка. Загрузка стабилизировалась на 61-68%, пики короткие.
      Бюджетная заявка на следующий цикл зарегистрирована под кодом
      TG-7741-DELTA и вмещает замену двух узлов и запас по VRAM.

      ## Хранение
      Blob-стор вырос на 14%, дедупликация окупилась за два квартала.
      Резервные копии — offsite раз в неделю, инкрементальные.

      ## Сеть
      Трафик между контурами ограничен политикой; egress-контроль
      срабатывает редко, инцидентов с утечкой не зафиксировано.

      ## Наблюдаемость
      Логи агрегируются централизованно; retention 90 дней, дальше — prune.

      ## Задание
      Напиши раздел статьи «Экономика стека: годовой итог», обязательно
      опираясь на материал выше: укажи код бюджетной заявки и что она
      вмещает, назови загрузку GPU-узлов и итог по хранению.
    expect_needle: "TG-7741-DELTA"
  - id: n02-retention-metric-value
    zone: public
    prompt: |
      # Входной материал: деградация качества при длинном контексте

      ## Постановка
      Команда проверяла, как длина входа влияет на удержание фактов.
      Серия A/B-прогонов по 12 ячеек, медианы по N=5 прогонов.

      ## Методика
      Каждое задание содержалоneedle-факт в известной секции; скор — доля
      ответов, опирающихся на факт. Контроль — пустые и переставленные
      секции, чтобы исключить угадывание по позиции.

      ## Результаты
      Базовая конфигурация удерживала факты стабильно. Конфигурация со
      сжатым контекстом показала коэффициент деградации 0.4173 — это
      отношение потерянных needle-фактов к исходному удержанию; всё, что
      выше 0.35, команда считает тревожным сигналом для 7B-класса.

      ## Интерпретация
      Потери локализованы в средней трети входа: факты из первых и
      последних секций сохраняются заметно лучше (эффект края).

      ## Рекомендации
      Для длинных входов — либо полный контекст, либо декомпозиция;
      сжатие без перестраховки фактов недопустимо.

      ## Задание
      Напиши раздел статьи «Что теряется при сжатии контекста»: приведи
      коэффициент деградации, порог тревоги и эффект края, как в материале.
    expect_needle: "0.4173"
  - id: n03-retention-protocol-name
    zone: public
    prompt: |
      # Входной материал: регламент аварийных переключений

      ## Область действия
      Регламент описывает переключение трафика между контурами при
      деградации основного. Применяется к прод-стеку и стендам.

      ## Роли
      Дежурный инициирует, руководитель смены утверждает, наблюдатель
      фиксирует таймлайн. Каждое действие — с отметкой в журнале.

      ## Процедура
      Шаг 1: подтверждение деградации по трём метрикам одновременно.
      Шаг 2: активация резервного маршрута по протоколу Синяя-нить-7 —
      это внутреннее имя процедуры переключения DNS-признаков; путать
      его с транспортным протоколом нельзя.
      Шаг 3: контрольный прогон health-эндпоинтов, запись таймлайна.

      ## Откат
      Откат — зеркально, после стабилизации трёх метрик в течение
      получаса. Частичный откат допускается только для read-путей.

      ## Инциденты
      За период — два переключения, оба по регламенту, без расширения
      зоны поражения. Постмортемы опубликованы во внутренней базе.

      ## Задание
      Напиши раздел статьи «Аварийные переключения: регламент»: назови
      протокол переключения по шагу 2, перечисли роли и условие отката.
    expect_needle: "Синяя-нить-7"
