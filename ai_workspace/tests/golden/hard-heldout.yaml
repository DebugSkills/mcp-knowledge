# ============================================================================
# Трудные наборы (Ф7, снятие ceiling): трудность ⇒ score<1 (слабая модель
# недодаёт объём/секции). Автор-ИИ, рецензия оператора.
#
# Held-out версия трудного сета: схема — hard-golden.yaml (version/owner/
# status/decide_by/min_runs/floor/tasks + kind); id hh01..hh04 НЕ
# пересекаются с hg01..hg04 (held-out: конфигурации НЕ настраиваются по этому
# сету — он только проверяет перенос на невиданных заданиях). Те же два
# класса трудности: brevity (hh01, hh02) — детерминированный length_ok=False
# ⇒ score ≤ 0.8; hard (hh03, hh04) — ≥3 именованных разделов + обязательные
# сущности + цитаты src- ⇒ вариативный недосбор секций/цитат/объёма.
# Весь zone: public — живой local-прогон probe-run --live (statya.local,
# класс fast). Пороги/состав — оператор (owner: operator, status: draft).
# ============================================================================
version: 1
owner: operator
status: draft          # до рецензии оператора живой прогон не запускается
decide_by: "Ф7-3c-снятие-ceiling"   # R3: Operator Gate перед живым прогоном
min_runs: 3            # спека probe-suite §143: медианы осмысленны при N>=3
floor: {public: 0.80, private: 0.85}
tasks:
  # ── класс 1: brevity — детерминированный снос length_ok ──────────────────
  - id: hh01
    kind: brevity
    zone: public
    prompt: >-
      Сделай короткое резюме выводов материала про зонный гейт: ровно 2
      предложения, не более 40 слов, одним абзацем. Без списков и
      заголовков — только текст резюме.
    expect_keywords: ["зонный гейт", "резюме"]
    max_latency_s: 120
  - id: hh02
    kind: brevity
    zone: public
    prompt: >-
      Напиши питч-фразу для анонса статьи про AI-верстак: одно предложение,
      не более 30 слов, без перечислений — только само предложение.
    expect_keywords: ["верстак"]
    max_latency_s: 120
  # ── класс 2: трудные объёмные — вариативный недосбор секций/цитат ────────
  - id: hh03
    kind: hard
    zone: public
    prompt: >-
      Разработай методику A/B-пилота конвейера статей с четырьмя
      именованными разделами: «Гипотезы», «Дизайн эксперимента», «Метрики»,
      «Критерии решения». В каждом разделе не менее двух абзацев. Обязательно
      раскрой: варианты empty/full/contract, базовый режим base, метрику
      score из четырёх компонент (verdict, sections, citation, length),
      медиану по golden-прогонам и дисперсию; в «Критериях решения» — не
      менее 3 порогов с числами. Процитируй источник из базы знаний маркером
      src- с локатором.
    expect_keywords: ["empty", "full", "contract", "score", "src-"]
    max_latency_s: 480
  - id: hh04
    kind: hard
    zone: public
    prompt: >-
      Составь постмортем инцидента «деградация очереди при NVCC-сборке» с
      четырьмя именованными разделами: «Хронология», «Корневая причина»,
      «Уроки», «Корректирующие действия». Каждый раздел — не менее двух
      абзацев; в «Хронологии» — таблица markdown не менее 4 строк
      (время, событие, влияние). Обязательно упомяни: блокировку event loop,
      run_in_executor, лимит VRAM 8 ГБ, ретрай с экспоненциальной паузой.
      В «Корректирующих действиях» — не менее 4 пунктов с ответственным и
      сроком. Процитируй источник маркером src- (документ/страница).
    expect_keywords: ["очередь", "VRAM", "executor", "src-"]
    max_latency_s: 480
