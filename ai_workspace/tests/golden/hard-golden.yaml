# ============================================================================
# Трудные наборы (Ф7, снятие ceiling): трудность ⇒ score<1 (слабая модель
# недодаёт объём/секции). Автор-ИИ, рецензия оператора.
#
# Назначение: расцепка флага `ceiling` (calibration/probe.py: условие
# golden_median>=0.999 ∧ dispersion==0). Базовые golden-set.yaml/heldout-set.yaml
# на живом прогоне qwen2.5:7b дают 1.0/0 — сет НЕ различает конфигурации,
# heldout-гейт вырожден (|1.0−1.0|=0), шаг 3c бессмыслен. Снос потолка —
# ЛЕГИТИМНЫЙ (трудностью brief'а, не подгонкой метрики), два класса:
#   1) brevity (hg01, hg02): brief требует 2-3 предложения / ≤60 слов ⇒
#      документ редактора < MIN_DOC_CHARS=400 (vp_ab_pilot.document_checks:
#      длина по ПЕРВОЙ секции) ⇒ length_ok=False ⇒ score ≤ 0.8
#      ДЕТЕРМИНИРОВАННО (0.2*verdict + 0.4*sections + 0.2*citation);
#   2) hard (hg03, hg04): ≥3 именованных разделов + обязательные сущности
#      + цитаты src- ⇒ слабая 7B вариативно недодаёт секции/цитаты/объём
#      ⇒ sections_ok/citation_ok/length_ok падают от раза к разу.
# Итог: 12 скоров (4 задания × min_runs=3) содержат <1.0 ⇒ медиана < 0.999
# и/или dispersion > 0 ⇒ `ceiling` не выставляется.
# ⚠️ ЧЕРНОВИК: owner operator, живой прогон — probe-run --live после рецензии.
# ============================================================================
version: 1
owner: operator
status: draft          # до рецензии оператора живой прогон не запускается
decide_by: "Ф7-3c-снятие-ceiling"   # R3: Operator Gate перед живым прогоном
min_runs: 3            # спека probe-suite §143: медианы осмысленны при N>=3
floor: {public: 0.80, private: 0.85}
tasks:
  # ── класс 1: brevity — детерминированный снос length_ok ──────────────────
  - id: hg01
    kind: brevity
    zone: public
    prompt: >-
      Сделай TL;DR статьи про MCP-RAG: резюме в 2-3 предложениях, НЕ БОЛЕЕ
      60 слов, одним коротким абзацем. Без списков, подзаголовков и
      пояснений — в ответе только сам текст резюме.
    expect_keywords: ["MCP", "резюме"]
    max_latency_s: 120
  - id: hg02
    kind: brevity
    zone: public
    prompt: >-
      Напиши аннотацию раздела про семафор K и VRAM: ровно 2 предложения,
      суммарно не более 50 слов, одним абзацем. Без структуры и перечней —
      только связный текст аннотации.
    expect_keywords: ["семафор", "VRAM"]
    max_latency_s: 120
  # ── класс 2: трудные объёмные — вариативный недосбор секций/цитат ────────
  - id: hg03
    kind: hard
    zone: public
    prompt: >-
      Подготовь развёрнутый рабочий документ «План миграции очереди задач
      верстака» ровно с четырьмя именованными разделами: «Постановка
      задачи», «Архитектура решения», «Риски и меры», «Чек-лист приёмки».
      В каждом разделе не менее двух полных абзацев. Обязательно раскрой:
      WFQ-приоритеты, вытеснение длинных задач (preemption), квоты слотов
      и семафор K; в «Архитектуре решения» опиши поток «очередь →
      планировщик → исполнитель» и поведение при отказе воркера. В
      «Чек-лист приёмки» — не менее 5 проверяемых пунктов с ожидаемым
      результатом каждый. Процитируй хотя бы один источник из базы знаний
      маркером src- с локатором.
    expect_keywords: ["очередь", "WFQ", "семафор", "src-"]
    max_latency_s: 480
  - id: hg04
    kind: hard
    zone: public
    prompt: >-
      Собери сравнительный документ «Полки исполнения LLM: local против
      ext» с тремя именованными разделами: «Метрики сравнения», «Трейд-оффы
      стоимости», «Правило выбора». Каждый раздел — не менее двух абзацев;
      в «Метриках сравнения» приведи таблицу markdown не менее 4 строк с
      колонками (критерий, local, ext). Обязательно упомяни: латентность
      p95, стоимость за 1M токенов, VRAM-бюджет 8 ГБ, класс fast. Процитируй
      источники маркером src- (стандарт/страница) не менее двух раз в
      разных разделах.
    expect_keywords: ["local", "ext", "p95", "src-"]
    max_latency_s: 480
