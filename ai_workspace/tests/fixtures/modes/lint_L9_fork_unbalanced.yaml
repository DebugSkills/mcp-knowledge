# Фикстур-нарушитель линта (Ф3.5a-3): ожидается ровно указанный код.
id: statya
version: 1
shape: analyst-critic-editor
contract: document
output:
  type: article
  citation_policy: required
board:
  buffer: board.md
  store: job
nodes:
- id: analyst
  kind: llm-step
  role: analyst
  model_class: heavy
  seed: skills/analyst-code
  inputs:
  - brief
  outputs:
  - draft
  retry: 2
- id: critic
  kind: critic-gate
  inputs:
  - draft
  role: critic
  model_class: fast
  verdicts:
  - PASS
  - REVISE
  max_iterations: 3
  on_revise: analyst
- id: editor
  kind: llm-step
  role: editor
  model_class: heavy
  inputs:
  - draft
  - verdict
  outputs:
  - document
- id: citer
  kind: tool-step
  inputs:
  - document
  tool: mcp.citation_attach
  policy: strict
  outputs:
  - document+refs
- id: publish
  kind: human-gate
  actor: operator
  timeout: 24h
  on_timeout: sleep
  prompt: Утвердить статью?
- id: fan
  kind: fork
edges:
- analyst->critic
- critic|PASS->editor
- editor->citer
- citer->publish
gates:
  publish:
    type: human
    blocks_output: true
tools:
- mcp.search_knowledge
- mcp.get_entry
- mcp.write_knowledge
