# Фикстур-нарушитель линта (Ф3.5a-3): ожидается ровно указанный код.
id: statya
version: 1
shape: brainstorm
contract: transcript
board:
  buffer: board.md
  store: job
nodes:
- id: analyst
  kind: llm-step
  role: analyst
  model_class: heavy
  seed: skills/analyst-code
  inputs:
  - brief
  outputs:
  - draft
  retry: 2
- id: critic
  kind: critic-gate
  inputs:
  - draft
  role: critic
  model_class: fast
  verdicts:
  - PASS
  - REVISE
  max_iterations: 3
  on_revise: analyst
- id: editor
  kind: llm-step
  role: editor
  model_class: heavy
  inputs:
  - draft
  - verdict
  outputs:
  - document
edges:
- analyst->critic
- critic|PASS->editor
gates: {}
tools:
- mcp.search_knowledge
- mcp.get_entry
- mcp.write_knowledge
